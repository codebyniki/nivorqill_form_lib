name: nivorquill_form_lib
description: Typed Flutter forms with validation, custom field bindings, debounced autosave, versioned draft recovery and user-scoped storage.
version: 1.0.0
repository: https://github.com/codebyniki/nivorqill_form_lib
issue_tracker: https://github.com/codebyniki/nivorqill_form_lib/issues
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
topics:
  - forms
  - validation
  - autosave
  - persistence
