name: Validate form library
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.0', '']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: flutter test test
        working-directory: example
      - name: Publication validation
        shell: bash
        run: |
          status=0
          log_file="$RUNNER_TEMP/nivorquill-pub-check.log"
          flutter pub publish --dry-run > "$log_file" 2>&1 || status=$?
          cat "$log_file"
          if [ "$status" -ne 0 ]; then
            if [ "$status" -ne 65 ] || ! grep -Fxq 'Package has 1 warning.' "$log_file" || ! grep -Fq 'include a "homepage" or "repository" field' "$log_file"; then
              exit "$status"
            fi
          fi
      - run: flutter create --platforms=web --project-name=nivorquill_form_lib_example .
        working-directory: example
      - run: flutter build web
        working-directory: example
  ios-storage:
    name: iOS native preferences integration
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
      - name: Boot an iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - run: flutter test integration_test/storage_test.dart -d "$IOS_DEVICE_ID"
        working-directory: example
  android-storage:
    name: Android native preferences integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: example
          script: flutter test integration_test/storage_test.dart -d emulator-5554
